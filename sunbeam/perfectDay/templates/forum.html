<!DOCTYPE html>
<html lang="en">
{% load static %}

<!--Comfortaa(main font)-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums</title>
    <link rel="stylesheet" href="{% static 'css/forum.css' %}">
</head>
<body>
  {% include 'nav.html' %}<!-- nav-->
  <h11 class="journal-page-title">Journal Entry</h11>
  <!-- The Answer Container-->
<!-- This wrapper forces the entire yellow block to slide to the center -->
<div class="main-container">
    <div class="DisplayContainer1">
        
        <!-- FIXED: Added the missing id="answerForm" so your CSS works! -->
        <form id="answerForm" onsubmit="return false;">
            <h1>SHARE YOUR THOUGHTS</h1>
            
            <div>
                <label>Name:</label>
                <input type="text" placeholder="Enter a name/nickname">
            </div>
            
            <div>
                <label>Review Paragraph</label>
                <textarea placeholder="Write your thoughts below"></textarea>
            </div>
            
            <button type="button">Submit Your Idea</button>
        </form>

    </div>
</div>

  <!-- Loads the replies -->
  <div class="main-container">
      <div class="DisplayContainer">
        <div id="reviewsDisplayContainer">
            <h1>Others' Replies</h1>
        <div id="answersList">Loading replies...</div>
      </div>  
  </div>
</body>
