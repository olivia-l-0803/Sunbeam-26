<!DOCTYPE html>
<html lang="en">
{% load static %}

<!--Comfortaa(main font)-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums</title>
    <link rel="stylesheet" href="{% static 'css/forum.css' %}">
</head>
<body>
  {% include 'nav.html' %}<!-- nav-->
  <div class="main-container">
    <div class="content-wrapper">
      <div class="DisplayContainer">
        <h1>What is your idea of a perfect day?</h1>
      </div>
    </div>  
  </div>

  <!-- The Answer Container-->
  <div class="main-container1">
    <div class="content-wrapper1">
      <div class="DisplayContainer1">
        <form id="answerForm">
          <h1>Share your thoughts</h1>
          <div>
                <label for="name">Name:</label>
                <input type="text" id="Name" placeholder="Enter a name/nickname" required>
          </div>
          <div>
                <label for="answerText">Review Paragraph</label>
                <textarea id="answerText" placeholder="Write your thoughts below" required></textarea>
          </div>
          <!-- Submission Button -->
              <button type="submit">
                <span class="button-text">Submit Review</span>
              </button>

              <!-- Error/Success Messages -->
              <div id="statusMsg"></div>
            </form>
        </div>
        </div>
      </div>
    </div>  
  </div>
  <!-- Loads the replies -->
  <div class="main-container">
    <div class="content-wrapper3">
      <div class="DisplayContainer">
        <div id="reviewsDisplayContainer">
            <h1>Others' Replies</h1>
        <div id="answersList">Loading replies...</div>
      </div>
    </div>  
  </div>
</body>
