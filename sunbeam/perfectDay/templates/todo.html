<!DOCTYPE html>
<html lang="en">
{% load static %}

<!--Comfortaa(main font)-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Comfortaa:wght@300..700&family=Mouse+Memoirs&family=Spicy+Rice&display=swap" rel="stylesheet">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="{% static 'css/todo.css' %}">
</head>
<body>
  {% include 'nav.html' %}<!-- nav-->
  <div class="heading">
    <h1>TO DO 📚: </h1>
    <h3>Plan your perfect day. </h3>
  </div>
  
  <div class="main-container">
    {% for task in tasks %}
      {% if not task.done %}
      <div class="taskBox">
        <button class = doneToggle id ="{{task.id}}" onclick="markedDone(this)" data-id="{{task.id}}"> </button>
        <p>{{task.text}}</p><p>{{task.id}}</p>
      </div>
      {% endif %}
    {% empty %} 
      <p>Nothing here yet!</p>
    {% endfor %}
  </div>

  <script src="{% static 'js/todo.js' %}" defer></script>

</body>
