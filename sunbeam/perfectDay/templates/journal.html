<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <!-- Fonts placed cleanly inside the head tag -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <!-- Included your project fonts for Bungee and Spicy Rice compatibility -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/journal.css' %}">
</head>
<body>
  
  {% include 'nav.html' %}

  <div class="journal-container">
    <h1 class="journal-page-title">Journal Entry</h1>

    <div class="journal-card">
      <form method="POST">
        {% csrf_token %}
        <input type="text" class="date-event-input" name="date-event-input" placeholder="Enter date/event" required>
        
        <div class="textarea-wrapper">
            <textarea class="journal-text-area" name="journal-text-area" contenteditable="true"  placeholder="Write about your day..." required></textarea>
        </div>
        
        <!-- RATINGS AT THE BOTTOM -->
        <div class="form-footer">
          <div class="face-rating-group">
            <label class="smiley-radio">
              <input type="radio" name="day-rating" value="1">
              <span class="face">🙁</span>
            </label>
            <label class="smiley-radio">
              <input type="radio" name="day-rating" value="2">
              <span class="face">😐</span>
            </label>
            <label class="smiley-radio">
              <input type="radio" name="day-rating" value="3" checked>
              <span class="face">🙂</span>
            </label>
            <label class="smiley-radio">
              <input type="radio" name="day-rating" value="4">
              <span class="face">😊</span>
            </label>
            <label class="smiley-radio">
              <input type="radio" name="day-rating" value="5">
              <span class="face">😁</span>
            </label>
          </div>

          <!-- SUBMIT BUTTON -->
          
        </div>
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
    <div class="journal-card">
      <h2 class="journal-card-title">Your Previous Entries</h2>
      <div class="previous-entries">
        <div id="reviewsDisplayContainer">
        {% for journal in journals %}
        <div class="oldBox">
          <p id="eventP">{{journal.event}}</p>
          <p>{{journal.text}}</p>
        </div>
        {% endfor %} 
      </div>
  </div>

</body>
</html>
