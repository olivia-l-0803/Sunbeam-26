<!DOCTYPE html>
<html lang="en">
{% load static %}

<!--Comfortaa(main font)-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>

<body>
    <div class="main-container">
        
        <!-- Background -->
        <img id = "bg" class="bglayer" src="{% static 'images/Image1.jpg' %}">

        <!-- Login -->
        <div class="login-card">
                
            <h1 class="login-heading">Sign In</h1>
            <!--WARNING WARNING WARNING-->
            {% if messages %}
                <div class="error-container" id = "error-container" style = "color: red; background-color: #ffcccc; padding: 15px; padding-bottom: 0; padding-top: 0; margin-bottom: 15px; border-radius: 4px; display: flex; flex-direction: row;">
                    {% for message in messages %}
                        <p>{{ message }}</p> 
                        <button type= "button" id="del" style="color: red; background-color: transparent; border: 0; cursor: pointer;">&#10006;</button> 
                    {% endfor %}
                </div>
            {% endif %}
            
            <!-- everythign clickable + working -->
            <form id = "formLog" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label>New Username</label>
                    <input type="text" class="text-input" name = "usernamefield" required> <!-- EMAIL FIELD EMAIL FIELD EMAIL-->
                </div>
                <!-- password  -->
                <div class="input-group">
                    <label>Create a Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password-input" class="text-input" name = "passwordfield" required>
                        
                    </div>
                </div>
                
                <!-- nter  button -->
                <button type="submit" class="secondary-button" id = "EnterClass">
                    <div class="btn-border"></div>
                    <span class="btn-text">Create Account</span>
                </button>

            </form>

            <a href="{% url 'Login' %}" class = "link"> Log In </a>
        
        </div>

    </div>
    <script src="{% static 'js/deleteBtn.js' %}" defer></script>
</body>
